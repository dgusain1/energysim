site_name: energysim
site_description: Python-based co-simulation tool for multi-energy systems
site_url: https://energysim.readthedocs.io
repo_url: https://github.com/dgusain1/energysim
repo_name: dgusain1/energysim

copyright: "Copyright &copy; 2020–2026 Digvijay Gusain"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/brand/energysim-mark-light.svg
  favicon: assets/brand/favicon.ico


nav:
  - Getting Started:
      - Overview & Quick Start: index.md
      - Engine Features: features.md
      - Migrating from 2.x to 3.0: migration-3.0.md

  - Multi-Energy Modeling:
      - Physical Components:
          - Overview & ModelComponent: physical-models.md
          - Storage:
              - Battery BESS: components/bess.md
              - Flow Battery (VRFB): components/flow_battery.md
              - Flywheel Storage: components/flywheel.md
          - Renewables:
              - Photovoltaic (PV): components/pv.md
              - Wind Turbine: components/wind.md
              - Solar Thermal Collector: components/solar_thermal.md
          - Hydrogen & PtX:
              - PEM Electrolyzer: components/pem_electrolyzer.md
              - Alkaline Electrolyzer: components/alkaline_electrolyzer.md
              - SOEC Electrolyzer: components/soec_electrolyzer.md
              - H2 Compressor: components/h2_compressor.md
              - H2 Storage Tank: components/h2_tank.md
              - Fuel Cells (PEM & SOFC): components/fuel_cell.md
              - Methanation Reactor: components/methanation.md
          - Thermal Generation:
              - Combined Cycle (CCGT): components/ccgt.md
              - Open Cycle (OCGT): components/ocgt.md
              - Reciprocating Genset: components/genset.md
              - CHP Steam Turbine: components/chp.md
          - Heating, Cooling & District Energy:
              - Industrial Heat Pump: components/heat_pump.md
              - Electric Boiler: components/electric_boiler.md
              - Chillers (Electric & Absorption): components/chiller.md
              - Thermal Storage Tank: components/thermal_storage.md
          - Loads & Carbon Capture:
              - Carbon Capture: components/carbon_capture.md
              - Data Center Load: components/datacenter.md
              - Industrial Process Steam: components/process_steam.md
          - Equipment Catalog Archetypes: components/catalog.md
          - Authoring Custom Models: custom-models.md
      - Vectorized Fleet Containers:
          - Overview & SIMD Acceleration: containers/overview.md
          - Storage & EV Battery Fleet: containers/storage_fleet.md
          - Solar PV Fleet: containers/pv_fleet.md
          - Building Thermal Fleet: containers/building_fleet.md
          - Heat Pump Fleet: containers/heat_pump_fleet.md
          - Building Custom Vectorized Fleets: containers/custom_fleet.md
      - Energy Networks:
          - Multi-Carrier Pipe Networks (Heat & Gas): networks.md

  - Simulator & Grid Adapters:
      - Supported Simulators & Grid Adapters: add-simulator.md
      - Custom External Simulators: external-simulators.md

  - Workflows & Simulation:
      - Declarative YAML & Scenarios: yaml-cli.md
      - Events & Variable Macro Step: events.md
      - Ensembles & Sweeps: ensemble.md
      - Control & Optimisation: control.md
      - Safe Mode & Trust Model: safe-mode.md

  - Tutorials & Case Studies:
      - Learning Roadmap & Curricula: notebooks-roadmap.md
      - Interactive Notebook Gallery: notebooks-gallery.md

  - Architecture & Reference:
      - Orchestration Architecture: architecture.md
      - Unit System & Policy: units.md
      - Results & KPIs: results.md
      - Validation & Benchmarks: validation.md
      - Frequently Asked Questions (FAQ): faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search
