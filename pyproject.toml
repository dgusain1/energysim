[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energysim"
version = "3.0.0.dev0"
description = "Python package for cosimulation of multi-energy systems"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Digvijay Gusain", email = "digvijay.gusain29@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
fmu = ["fmpy>=0.3.27,<0.4"]
powerflow = ["pandapower>=3.0,<4"]
pypsa = ["pypsa>=0.30,<2"]
opendss = ["opendssdirect.py>=0.9,<1"]
plotting = ["matplotlib"]
networks = ["scipy"]
control = ["scipy>=1.9"]
results = ["pyarrow"]
hdf5 = ["tables"]
all = ["fmpy>=0.3.27,<0.4", "pandapower>=3.0,<4", "pypsa>=0.30,<2", "opendssdirect.py>=0.9,<1", "matplotlib", "scipy>=1.9", "pyarrow", "tables"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocs-material-extensions>=1.3.1", "pymdown-extensions>=10.7"]
test = ["pytest", "pytest-cov", "hypothesis", "nbclient", "nbformat", "ipykernel"]
dev = ["energysim[test]", "ruff", "mypy", "build", "twine"]

[project.scripts]
energysim = "energysim.cli:main"

[project.urls]
Homepage = "https://github.com/dgusain1/energysim"
Documentation = "https://energysim.readthedocs.io"
Repository = "https://github.com/dgusain1/energysim"
Issues = "https://github.com/dgusain1/energysim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/energysim"]

[dependency-groups]
dev = [
    "pytest",
    "mkdocs-material",
    "mkdocs-material-extensions",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_pypsa: needs the optional 'pypsa' package",
    "requires_pandapower: needs the optional 'pandapower' package",
    "requires_opendss: needs the optional 'opendssdirect.py' package",
    "requires_fmu: needs 'fmpy' and the downloadable Reference-FMUs (skipped when offline)",
    "requires_octave: needs 'oct2py' and a GNU Octave installation",
    "requires_matlab: needs the MATLAB Engine for Python and a MATLAB licence",
    "requires_powerfactory: needs DIgSILENT PowerFactory and a licence (manual only)",
    "validation: physical/analytic validation benchmarks (see docs/validation.md)",
    "strength: tests demonstrating a product strength",
    "slow: slow tests (packaging, long runs)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# Existing code predates these rules; tracked for later cleanup rather than enforced now.
ignore = ["I001", "B905", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S110", "S112", "B007", "S310", "S311", "S603", "B017", "F401", "F841", "E731", "E501"]
"src/energysim/**" = ["S101", "S110", "S311", "E501", "E731", "F401", "F541", "F841", "W293", "B009"]

[tool.coverage.run]
source = ["src/energysim"]
branch = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

