[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energysim"
version = "2.1.9.1"
description = "Python package for cosimulation of multi-energy systems"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Digvijay Gusain", email = "digvijay.gusain29@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "tables",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
fmu = ["fmpy>=0.3"]
powerflow = ["pandapower"]
pypsa = ["pypsa"]
opendss = ["opendssdirect.py"]
plotting = ["matplotlib"]
networks = ["scipy"]
all = ["fmpy>=0.3", "pandapower", "pypsa", "opendssdirect.py", "matplotlib", "scipy"]
docs = ["mkdocs-material", "mkdocs-material-extensions"]
test = ["pytest", "pytest-cov", "hypothesis"]
dev = ["energysim[test]", "ruff", "mypy", "build", "twine"]

[project.scripts]
energysim = "energysim.cli:main"

[project.urls]
Homepage = "https://github.com/dgusain1/energysim"
Documentation = "https://energysim.readthedocs.io"
Repository = "https://github.com/dgusain1/energysim"
Issues = "https://github.com/dgusain1/energysim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/energysim"]

[dependency-groups]
dev = [
    "pytest",
    "mkdocs-material",
    "mkdocs-material-extensions",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# Existing code predates these rules; tracked for later cleanup rather than enforced now.
ignore = ["I001", "B905", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "F401", "F841", "E731", "E501"]
"src/energysim/**" = ["S101", "S110", "S311", "E501", "E731", "F401", "F541", "F841", "W293", "B009"]

[tool.coverage.run]
source = ["src/energysim"]
branch = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

