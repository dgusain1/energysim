name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly validation run, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install "ruff==0.17.2"

      - name: Run ruff
        run: ruff check src tests

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # Python 3.14 is still pre-release for this project: its failures do not block CI.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest tests --cov=energysim --cov-report=xml -m "not slow"

  extras:
    name: Full suite with all optional dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Run full test suite (including optional-dependency tests)
        run: python -m pytest tests -v

  octave:
    name: Octave integration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Install package, test tools and oct2py
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" oct2py

      - name: Run Octave-marked tests
        # Exit code 5 means no test carries the marker yet; that is not a failure.
        run: python -m pytest -m requires_octave -v || [ $? -eq 5 ]

  docs:
    name: Docs build (strict)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs requirements and the package
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install -e ".[all]" pytest

      - name: Regenerate generated docs and verify they are committed
        run: |
          python scripts/generate_units_doc.py
          python scripts/generate_reference_docs.py
          python scripts/generate_readme_features.py
          git diff --exit-code -- README.md docs

      - name: Docs consistency tests (claims, generated docs, snippets)
        run: python -m pytest tests/docs -q -m "not slow" -p no:cacheprovider

      - name: Build docs with strict mode
        run: mkdocs build --strict

  package:
    name: Build and check distribution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Verify py.typed is shipped in the wheel
        run: |
          python -c "import glob, zipfile; w = glob.glob('dist/*.whl')[0]; n = zipfile.ZipFile(w).namelist(); assert any(x.endswith('energysim/py.typed') for x in n), 'py.typed missing'"

      - name: Install wheel into a clean venv (no extras) and smoke test
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean-venv/bin/python" -c "import energysim"
          "$RUNNER_TEMP/clean-venv/bin/energysim" --version

  validation:
    name: Weekly validation suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Run validation tests
        # Exit code 5 means no test carries the marker yet; the JUnit file is still produced.
        run: python -m pytest -m validation --junitxml=validation-junit.xml -v || [ $? -eq 5 ]

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4 # v4
        with:
          name: validation-junit
          path: validation-junit.xml
          if-no-files-found: warn
          retention-days: 30
